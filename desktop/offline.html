<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNIBLE SALE — 연결할 수 없음</title>
<style>:root{--bg:#f8fafc;--fg:#0f172a;--mut:#64748b;--card:#fff;--bd:#e2e8f0;--ac:#1d4ed8}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--fg:#e5e7eb;--mut:#94a3b8;--card:#111a2e;--bd:#22304a;--ac:#60a5fa}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,"Segoe UI","Malgun Gothic",sans-serif}
.card{width:min(520px,calc(100% - 32px));background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:28px}
h1{font-size:20px;margin:0 0 8px}p{margin:6px 0;color:var(--mut)}code{background:var(--bg);padding:2px 6px;border-radius:6px;color:var(--fg)}
.row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}button{font:inherit;padding:10px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}</style></head><body>
<div class="card"><h1>서버에 연결할 수 없습니다</h1>
<p>인터넷 연결이나 서버 주소를 확인한 뒤 다시 시도하세요.</p>
<p>서버: <code id="u">-</code></p><p id="r" style="font-size:13px"></p>
<div class="row"><button class="pri" id="retry">다시 시도</button><button id="set">서버 주소 설정</button></div></div>
<script>const q=new URLSearchParams(location.search);document.getElementById('u').textContent=q.get('url')||'-';document.getElementById('r').textContent=q.get('reason')||'';
document.getElementById('retry').onclick=()=>window.unibleDesktop.retry();document.getElementById('set').onclick=()=>window.unibleDesktop.openSettings();</script></body></html>
